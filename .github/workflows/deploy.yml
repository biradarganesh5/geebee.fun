# Build the site into a container image, publish it to GHCR, then record the new
# tag in the homelab repo so Argo CD deploys it.
#
# The cluster is not reachable from the internet, and this pipeline never tries:
# GitHub builds and pushes, Argo CD pulls. Nothing has to be exposed for CI/CD.
#
# ONE-TIME SETUP
#   1. Settings -> Actions -> General -> Workflow permissions:
#        "Read and write permissions"    (lets the job push to GHCR)
#
#   2. A workflow's built-in token cannot write to a DIFFERENT repository, so
#      pushing the deploy commit needs its own credential. Use a DEPLOY KEY:
#
#        ssh-keygen -t ed25519 -f homelab-deploy -N "" -C "geebee.fun-deploy"
#
#      homelab repo -> Settings -> Deploy keys -> Add deploy key
#        paste homelab-deploy.pub, and TICK "Allow write access"
#
#      this repo -> Settings -> Secrets and variables -> Actions
#        HOMELAB_DEPLOY_KEY = contents of the PRIVATE key file
#
#      Chosen over a fine-grained PAT because a deploy key never expires and its
#      write access is one checkbox, rather than a permission matrix that fails
#      by granting nothing.
#
#   3. After the first successful push, make the GHCR package public:
#        Profile -> Packages -> geebee.fun -> Package settings -> Change
#        visibility -> Public
#      Otherwise the cluster needs an imagePullSecret to pull it.

name: Build and deploy

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/geebee.fun
  HOMELAB_REPO: biradarganesh5/homelab
  MANIFEST: gitops/manifests/websites/geebee-site.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag with the commit SHA, never `latest`: Kubernetes will not reliably
      # re-pull a moving tag, and an immutable tag makes the manifest an exact
      # record of what is running, so rollback is `git revert`.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Cache layers in Actions so npm ci is not repeated on every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the new tag in the homelab repo
        env:
          # A DEPLOY KEY rather than a PAT: scoped to exactly one repository,
          # never expires, and its write permission is a single checkbox instead
          # of a permission matrix that silently grants nothing when misconfigured.
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::HOMELAB_DEPLOY_KEY is not set. The image was pushed," \
                 "but Argo CD will not pick it up."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pin GitHub's host key instead of disabling host verification.
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          # IdentitiesOnly stops ssh from offering any other key the runner has.
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"

          git clone --depth 1 "git@github.com:${HOMELAB_REPO}.git" homelab
          cd homelab

          if ! grep -qE "image: ${IMAGE}:" "${MANIFEST}"; then
            echo "::error::No image line for ${IMAGE} found in ${MANIFEST}"
            exit 1
          fi

          # Replace whatever tag is there (a SHA, or the initial placeholder).
          # POSIX character class rather than \S, which is a GNU extension.
          sed -i -E "s|image: ${IMAGE}:[^[:space:]]+|image: ${IMAGE}:${SHA}|" "${MANIFEST}"

          # Verify the rewrite actually happened. Without this check, a sed that
          # matched nothing would leave the file unchanged, and the "nothing to
          # commit" branch below would report success for a deploy that never
          # happened.
          if ! grep -q "image: ${IMAGE}:${SHA}" "${MANIFEST}"; then
            echo "::error::Failed to set the image tag to ${SHA} in ${MANIFEST}"
            grep -n "image: ${IMAGE}" "${MANIFEST}" || true
            exit 1
          fi

          if git diff --quiet; then
            echo "Manifest already at ${SHA} (re-run of the same commit); nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy geebee.fun ${SHA}"

          # Retry once in case another commit landed while we were building.
          git push || { git pull --rebase && git push; }
